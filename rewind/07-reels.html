<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>
<div class="r-stage">
  <div class="r-phone" data-frame>
    <header class="r-top r-top--back">
      <a class="r-back" href="03-thu-vien.html"><i data-ico="back"></i>Thư viện</a>
      <span class="r-src" style="margin-left: auto; margin-right: 12px">Reels</span>
    </header>
    <main class="r-body" style="gap: 18px; padding-top: 4px">
      <div class="r-card" role="img" aria-label="Khung nhúng chính thức của Instagram" style="overflow: hidden">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-bottom: 2.5px solid var(--line)">
          <span style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--pink)"></span>
          <span style="flex: 1; font-size: 14px; font-weight: 700">@daily.english.bites</span>
          <span style="font-size: 13px; font-weight: 700; text-decoration: underline; white-space: nowrap">Xem trên Instagram</span>
        </div>
        <div style="height: 360px; background: #2A1E2C; display: grid; place-items: center">
          <span style="width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#FFFFFF"/></svg></span>
        </div>
      </div>

      <a class="r-btn r-btn--primary r-btn--lg r-btn--block" href="06-luu-tu.html"><i data-ico="bookmark"></i>Lưu từ vừa nghe</a>

      <section style="display: flex; flex-direction: column; gap: 12px" aria-labelledby="h-saved">
        <div style="display: flex; align-items: center; gap: 8px">
          <h2 class="r-h2" id="h-saved">Đã lưu</h2>
          <span class="r-chip r-chip--sun" style="min-height: 26px; font-size: 13px">2</span>
        </div>
        <div class="r-list">
          <div class="r-row"><span class="r-time">0:12</span><span class="r-row__main"><span class="r-row__title">I'll pass, thanks</span><span class="r-row__meta">Thôi, cảm ơn nhé</span></span></div>
          <div class="r-row"><span class="r-time">0:31</span><span class="r-row__main"><span class="r-row__title">not my cup of tea</span><span class="r-row__meta">Không phải gu của tôi</span></span></div>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="art.js"></script>
