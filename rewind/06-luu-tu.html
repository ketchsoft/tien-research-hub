<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lưu từ vừa nghe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>
<div class="r-stage">
  <div class="r-phone" data-frame style="background: var(--player)">
    <div style="height: 60px"></div>
    <div class="r-player" role="img" aria-label="Player YouTube đang dừng ở 02:14">
      <span class="r-chip" style="background: rgba(255,255,255,.14); color: #FFF7EA; border-color: transparent"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="#FFF7EA"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#FFF7EA"/></svg>Đã dừng ở 02:14</span>
    </div>
    <div class="r-dim" aria-hidden="true" style="top: 279px"></div>

    <section class="r-sheet" aria-labelledby="sheet-title">
      <span class="r-handle" aria-hidden="true"></span>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h1 class="r-h2" id="sheet-title" style="display: flex; align-items: center; gap: 10px">Lưu tại <span class="r-time" style="font-size: 15px; height: 30px">02:14</span></h1>
        <a class="r-icon-btn" href="05-xem-video.html" aria-label="Đóng"><i data-ico="close" data-size="18"></i></a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label class="r-label" for="heard">Bạn vừa nghe được</label>
        <input class="r-input" id="heard" type="text" value="take a rain check" autocapitalize="off" spellcheck="false" style="font-size: 20px; font-weight: 700; border-color: var(--tomato); box-shadow: 3px 3px 0 var(--tomato)">
      </div>

      <div class="r-card r-card--pad" style="display: flex; flex-direction: column; gap: 12px; background: var(--lilac-soft)">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span class="r-h2" style="font-size: 26px; line-height: 30px">Hẹn dịp khác</span>
            <span style="display: flex; align-items: center; gap: 8px"><span class="r-small" style="font-size: 14px">/teɪk ə reɪn tʃek/</span><span class="r-chip" style="min-height: 24px; font-size: 12px; padding: 0 8px">thành ngữ</span></span>
          </div>
          <button class="r-icon-btn" type="button" aria-label="Nghe phát âm" style="width: 52px; height: 52px; background: var(--mint); color: #1C1B29"><i data-ico="speaker"></i></button>
        </div>
        <p style="font-size: 15px; line-height: 23px">I'll <span class="r-mark">take a rain check</span> on dinner tonight.</p>
      </div>

      <a class="r-btn r-btn--primary r-btn--lg r-btn--block" href="05-xem-video.html"><i data-ico="bookmark"></i>Lưu vào ôn tập</a>
    </section>
  </div>
</div>
<script src="art.js"></script>
</body>
</html>
